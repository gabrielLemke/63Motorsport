services:
  postgres:
    image: postgres:16-alpine
    container_name: motorsport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-motorsport_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motorsport_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-motorsport_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-motorsport_user} -d ${DB_NAME:-motorsport_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
